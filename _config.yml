# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "mint" # Options: "default", "air", "sunrise", "mint", "dirt", "contrast"
title                    : "Abhro Shome Pias"
title_separator          : "-"
name                     : &name "Abhro Shome Pias"
description              : &description "Ph.D. student in Industrial and Systems Engineering at Auburn University researching machine learning, biosignal processing, and sleep informatics."
url                      : "https://abhro034.github.io"
baseurl                  : ""
repository               : "Abhro034/abhro034.github.io"

# Site Author - Controls the content appearing in the left-hand sidebar.
author:
  # Biographic information
  avatar                 : "profile.png"
  name                   : "Abhro Shome Pias"
  pronouns               : "He/Him"
  bio                    : "Ph.D. student in Industrial and Systems Engineering at Auburn University. Research interests include machine learning, biosignal processing, and sleep informatics."
  location               : "Auburn, Alabama"
  employer               : "Auburn University"
  uri                    : "https://abhro034.github.io"
  email                  : "asp0115@auburn.edu"

  # Academic websites
  academia               : 
  arxiv                  : 
  googlescholar          : "https://scholar.google.com/citations?user=MpusZEEAAAAJ&hl=en"
  inspire-hep            : 
  impactstory            : 
  orcid                  : "0009-0005-6273-7133"
  semantic               : 
  ssrn                   : 
  pubmed                 : 
  researchgate           : 
  scopus                 : 
  zotero                 : 

  # Repositories and software development
  bitbucket              : 
  codepen                : 
  dribbble               : 
  github                 : "Abhro034"
  kaggle                 : 
  stackoverflow          : 

  # Social media
  artstation             : 
  bluesky                : 
  facebook               : 
  flickr                 : 
  foursquare             : 
  goodreads              : 
  google_plus            : 
  keybase                : 
  instagram              : 
  lastfm                 : 
  linkedin               : "https://www.linkedin.com/in/abhro-shome-pias-17288a1a3/"
  mastodon               : 
  medium                 : 
  pinterest              : 
  soundcloud             : 
  steam                  : 
  telegram               : 
  tumblr                 : 
  twitter                : 
  vine                   : 
  weibo                  : 
  wikipedia              : 
  xing                   : 
  youtube                : 
  zhihu                  : 

# Publication Category - Headings for publication types
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   : # filename of teaser fallback image placed in /images/
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false
  disqus:
    shortname            : 
  discourse:
    server               : 
  facebook:
    appid                : 
    num_posts            : 5
    colorscheme          : "light"
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "master"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"
atom_feed:
  hide                   : false
  path                   : 

# SEO Related
google_site_verification : 
bing_site_verification   : 
alexa_site_verification  : 
yandex_site_verification : 

# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               : 
  app_id                 : 
  publisher              : 
og_image                 : profile.png
og_description           : 

social:
  type                   : "Person"
  name                   : "Abhro Shome Pias"
  links:
    - "https://github.com/Abhro034"

# Analytics
analytics:
  provider               : "false"
  google:
    tracking_id          : 

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections configuration
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Scoped defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: America/Chicago

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
